name: Collect stock data

on:
  schedule:
    # Every 2 hours, UTC — catches different points across US pre-market/
    # regular/post-market and KR trading hours without being wasteful.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python collect.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update collected data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
