name: Collect stock data

on:
  schedule:
    # Every 2 hours, UTC — catches different points across US pre-market/
    # regular/post-market and KR trading hours without being wasteful.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python collect.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update collected data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The desktop app can also push to this same repo every 10
          # minutes while it's running — if it lands between this job's
          # checkout and this push, a plain `git push` would be rejected
          # as non-fast-forward with no retry, silently dropping this
          # run's data until the next 2h cycle. Rebase onto whatever's new
          # first, same defensive move the app's own push already makes.
          git pull --rebase --autostash
          git push
